<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小站 · 生活记录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #2b2b2b; background: #f7f5f0; line-height: 1.7; }
  header { background: #fff; border-bottom: 1px solid #e6e1d8; padding: 18px 0; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  header .wrap { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
  nav a { color: #6b655c; text-decoration: none; margin-left: 22px; font-size: 14px; }
  nav a:hover { color: #b3543f; }
  .hero { padding: 56px 0 30px; }
  .hero h1 { font-size: 30px; margin-bottom: 10px; }
  .hero p { color: #6b655c; }
  article { background: #fff; border: 1px solid #e6e1d8; border-radius: 10px; padding: 26px 28px; margin-bottom: 20px; }
  article h2 { font-size: 19px; margin-bottom: 6px; }
  article .date { color: #a39a8b; font-size: 13px; margin-bottom: 10px; }
  article p { color: #4a463f; font-size: 15px; }
  footer { text-align: center; color: #a39a8b; font-size: 13px; padding: 34px 0 44px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo">小站</div>
    <nav>
      <a href="#">首页</a>
      <a href="#">随记</a>
      <a href="#">相册</a>
      <a href="#">关于</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <section class="hero">
    <h1>把日子过成记录</h1>
    <p>一些日常、一些想法，慢慢写，慢慢更新。</p>
  </section>
  <article>
    <h2>秋天的第一场雨</h2>
    <div class="date">2026-11-02</div>
    <p>傍晚开始落雨，窗台上的绿植被打得轻轻点头。煮了一壶热茶，把前几天没看完的书又翻了出来，雨声正好当背景。</p>
  </article>
  <article>
    <h2>周末的菜市场</h2>
    <div class="date">2026-10-26</div>
    <p>早起去了趟菜市场，萝卜带着泥，鱼摊的水花溅到鞋面。买了排骨和莲藕，晚上炖一锅汤，屋子里都是香味。</p>
  </article>
  <article>
    <h2>整理旧照片</h2>
    <div class="date">2026-10-18</div>
    <p>翻出一箱子旧照片，有小时候的，也有刚工作那几年的。挑了几张扫进电脑，剩下的按年份扎好，放回柜子最里面。</p>
  </article>
</main>
<footer>© 2026 小站 · 用心生活，慢慢记录</footer>
</body>
</html>
